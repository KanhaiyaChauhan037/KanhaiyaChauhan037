<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1040"/>
      <stop offset="50%" stop-color="#141b3c"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#36BCF7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bgGrad2)"/>

  <!-- distant stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="150" cy="90" r="1" opacity="0.4"/>
    <circle cx="250" cy="30" r="1.4" opacity="0.7"/>
    <circle cx="760" cy="60" r="1.2" opacity="0.5"/>
    <circle cx="820" cy="120" r="1" opacity="0.4"/>
    <circle cx="700" cy="200" r="1.3" opacity="0.6"/>
    <circle cx="120" cy="200" r="1.1" opacity="0.5"/>
    <circle cx="40" cy="150" r="1" opacity="0.4"/>
  </g>

  <!-- 3D orbiting AI core, centered -->
  <g transform="translate(450,130)">

    <!-- outer tilted orbit ring 1 -->
    <ellipse rx="150" ry="46" fill="none" stroke="#36BCF7" stroke-width="1.4" opacity="0.55" transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" from="-18 0 0" to="342 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <!-- outer tilted orbit ring 2 -->
    <ellipse rx="150" ry="46" fill="none" stroke="#8A2BE2" stroke-width="1.4" opacity="0.5" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="45 0 0" to="-315 0 0" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <!-- inner tilted orbit ring 3 -->
    <ellipse rx="105" ry="30" fill="none" stroke="#36BCF7" stroke-width="1.2" opacity="0.4" transform="rotate(100)">
      <animateTransform attributeName="transform" type="rotate" from="100 0 0" to="460 0 0" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- orbiting particles riding the rings -->
    <g>
      <circle r="4.5" fill="#ffffff" filter="url(#glow2)">
        <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbitPathA"/>
        </animateMotion>
      </circle>
      <circle r="4" fill="#8A2BE2" filter="url(#glow2)">
        <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbitPathB"/>
        </animateMotion>
      </circle>
      <circle r="3.5" fill="#36BCF7" filter="url(#glow2)">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbitPathC"/>
        </animateMotion>
      </circle>
    </g>

    <!-- invisible reference paths for the particles to follow (match ring geometry) -->
    <path id="orbitPathA" d="M150,0 A150,46 -18 1,1 149.99,0.01 Z" fill="none" opacity="0"/>
    <path id="orbitPathB" d="M150,0 A150,46 45 1,1 149.99,0.01 Z" fill="none" opacity="0"/>
    <path id="orbitPathC" d="M105,0 A105,30 100 1,1 104.99,0.01 Z" fill="none" opacity="0"/>

    <!-- glowing core -->
    <circle r="34" fill="url(#coreGlow)"/>
    <circle r="14" fill="#0a0e27" stroke="#36BCF7" stroke-width="2">
      <animate attributeName="r" values="14;17;14" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- caption -->
  <text x="450" y="235" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#a9b8f0" letter-spacing="2">
    ALWAYS LEARNING • ALWAYS SHIPPING
  </text>
</svg>
