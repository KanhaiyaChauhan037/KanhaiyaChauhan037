<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1040"/>
      <stop offset="50%" stop-color="#141b3c"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#36BCF7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="textGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#8A2BE2">
        <animate attributeName="offset" values="1;0;1" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="floorClip2">
      <rect x="0" y="110" width="900" height="150"/>
    </clipPath>
  </defs>

  <rect width="900" height="260" fill="url(#bgGrad2)"/>

  <!-- 3D perspective floor grid -->
  <g clip-path="url(#floorClip2)">
    <line x1="450" y1="110" x2="-200" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="-100" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="0" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="150" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="300" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="450" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="600" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="750" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="900" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="1000" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="110" x2="1100" y2="260" stroke="#5a3f9e" stroke-width="1" opacity="0.3"/>

    <line stroke="#8A2BE2" stroke-width="1" opacity="0.5">
      <animate attributeName="x1" values="450.0;446.0;437.8;426.7;413.0;397.2;379.3;359.5;337.9;314.7;289.8;263.4;235.6;206.3;175.6;143.6;110.2;75.6;39.8;2.7;-35.5;-75.0;-115.5;-157.2;-200.0" dur="4s" begin="-0.0s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="450.0;454.0;462.2;473.3;487.0;502.8;520.7;540.5;562.1;585.3;610.2;636.6;664.4;693.7;724.4;756.4;789.8;824.4;860.2;897.3;935.5;975.0;1015.5;1057.2;1100.0" dur="4s" begin="-0.0s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="110.0;110.9;112.8;115.4;118.5;122.2;126.3;130.9;135.9;141.2;147.0;153.1;159.5;166.2;173.3;180.7;188.4;196.4;204.7;213.2;222.0;231.1;240.5;250.1;260.0" dur="4s" begin="-0.0s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="110.0;110.9;112.8;115.4;118.5;122.2;126.3;130.9;135.9;141.2;147.0;153.1;159.5;166.2;173.3;180.7;188.4;196.4;204.7;213.2;222.0;231.1;240.5;250.1;260.0" dur="4s" begin="-0.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="-0.0s" repeatCount="indefinite"/>
    </line>
    <line stroke="#8A2BE2" stroke-width="1" opacity="0.5">
      <animate attributeName="x1" values="450.0;446.0;437.8;426.7;413.0;397.2;379.3;359.5;337.9;314.7;289.8;263.4;235.6;206.3;175.6;143.6;110.2;75.6;39.8;2.7;-35.5;-75.0;-115.5;-157.2;-200.0" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="450.0;454.0;462.2;473.3;487.0;502.8;520.7;540.5;562.1;585.3;610.2;636.6;664.4;693.7;724.4;756.4;789.8;824.4;860.2;897.3;935.5;975.0;1015.5;1057.2;1100.0" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="110.0;110.9;112.8;115.4;118.5;122.2;126.3;130.9;135.9;141.2;147.0;153.1;159.5;166.2;173.3;180.7;188.4;196.4;204.7;213.2;222.0;231.1;240.5;250.1;260.0" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="110.0;110.9;112.8;115.4;118.5;122.2;126.3;130.9;135.9;141.2;147.0;153.1;159.5;166.2;173.3;180.7;188.4;196.4;204.7;213.2;222.0;231.1;240.5;250.1;260.0" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
    </line>
    <line stroke="#8A2BE2" stroke-width="1" opacity="0.5">
      <animate attributeName="x1" values="450.0;446.0;437.8;426.7;413.0;397.2;379.3;359.5;337.9;314.7;289.8;263.4;235.6;206.3;175.6;143.6;110.2;75.6;39.8;2.7;-35.5;-75.0;-115.5;-157.2;-200.0" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="450.0;454.0;462.2;473.3;487.0;502.8;520.7;540.5;562.1;585.3;610.2;636.6;664.4;693.7;724.4;756.4;789.8;824.4;860.2;897.3;935.5;975.0;1015.5;1057.2;1100.0" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="110.0;110.9;112.8;115.4;118.5;122.2;126.3;130.9;135.9;141.2;147.0;153.1;159.5;166.2;173.3;180.7;188.4;196.4;204.7;213.2;222.0;231.1;240.5;250.1;260.0" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="110.0;110.9;112.8;115.4;118.5;122.2;126.3;130.9;135.9;141.2;147.0;153.1;159.5;166.2;173.3;180.7;188.4;196.4;204.7;213.2;222.0;231.1;240.5;250.1;260.0" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- horizon glow -->
  <rect x="0" y="107" width="900" height="6" fill="#8A2BE2" opacity="0.25" filter="url(#glow2)"/>

  <!-- distant stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="150" cy="90" r="1" opacity="0.4"/>
    <circle cx="250" cy="30" r="1.4" opacity="0.7"/>
    <circle cx="760" cy="60" r="1.2" opacity="0.5"/>
    <circle cx="820" cy="120" r="1" opacity="0.4"/>
    <circle cx="700" cy="200" r="1.3" opacity="0.6"/>
    <circle cx="120" cy="200" r="1.1" opacity="0.5"/>
    <circle cx="40" cy="150" r="1" opacity="0.4"/>
  </g>

  <!-- 3D orbiting AI core, centered -->
  <g transform="translate(450,130)">

    <!-- outer tilted orbit ring 1 -->
    <ellipse rx="150" ry="46" fill="none" stroke="#36BCF7" stroke-width="1.4" opacity="0.55" transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" from="-18 0 0" to="342 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <!-- outer tilted orbit ring 2 -->
    <ellipse rx="150" ry="46" fill="none" stroke="#8A2BE2" stroke-width="1.4" opacity="0.5" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="45 0 0" to="-315 0 0" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <!-- inner tilted orbit ring 3 -->
    <ellipse rx="105" ry="30" fill="none" stroke="#36BCF7" stroke-width="1.2" opacity="0.4" transform="rotate(100)">
      <animateTransform attributeName="transform" type="rotate" from="100 0 0" to="460 0 0" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- orbiting particles riding the rings -->
    <g>
      <circle r="4.5" fill="#ffffff" filter="url(#glow2)">
        <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbitPathA"/>
        </animateMotion>
      </circle>
      <circle r="4" fill="#8A2BE2" filter="url(#glow2)">
        <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbitPathB"/>
        </animateMotion>
      </circle>
      <circle r="3.5" fill="#36BCF7" filter="url(#glow2)">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
          <mpath href="#orbitPathC"/>
        </animateMotion>
      </circle>
    </g>

    <!-- invisible reference paths for the particles to follow (match ring geometry) -->
    <path id="orbitPathA" d="M150,0 A150,46 -18 1,1 149.99,0.01 Z" fill="none" opacity="0"/>
    <path id="orbitPathB" d="M150,0 A150,46 45 1,1 149.99,0.01 Z" fill="none" opacity="0"/>
    <path id="orbitPathC" d="M105,0 A105,30 100 1,1 104.99,0.01 Z" fill="none" opacity="0"/>

    <!-- glowing core -->
    <circle r="34" fill="url(#coreGlow)"/>
    <circle r="14" fill="#0a0e27" stroke="#36BCF7" stroke-width="2">
      <animate attributeName="r" values="14;17;14" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name -->
  <text x="450" y="30" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" fill="url(#textGrad2)" filter="url(#glow2)">
    KANHAIYA CHAUHAN
  </text>

  <!-- profession -->
  <text x="450" y="52" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#a9b8f0" letter-spacing="1">
    Full-Stack &amp; React Native Developer
  </text>

  <!-- caption -->
  <text x="450" y="235" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#a9b8f0" letter-spacing="2">
    ALWAYS LEARNING • ALWAYS SHIPPING
  </text>
</svg>
