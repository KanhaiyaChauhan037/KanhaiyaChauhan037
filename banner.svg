<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="55%" stop-color="#141b3c"/>
      <stop offset="100%" stop-color="#1b1040"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#36BCF7">
        <animate attributeName="offset" values="1;0;1" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="280" fill="url(#bgGrad)"/>

  <!-- faint circuit grid -->
  <g stroke="#2a3566" stroke-width="1" opacity="0.35">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
  </g>

  <!-- neural network connections -->
  <g stroke="#36BCF7" stroke-width="1.4" fill="none" opacity="0.55">
    <path id="p1" d="M60,60 C180,20 220,90 340,55">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path id="p2" d="M60,220 C170,260 230,180 340,220">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path id="p3" d="M60,140 C160,140 220,60 340,55">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path id="p4" d="M60,140 C160,140 220,220 340,220">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path id="p5" d="M560,55 C680,20 740,90 840,60">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path id="p6" d="M560,220 C670,260 750,190 840,220">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="3.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- traveling data pulses -->
  <circle r="3.5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#p1"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3.6s" repeatCount="indefinite">
      <mpath href="#p2"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite">
      <mpath href="#p5"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3.9s" repeatCount="indefinite">
      <mpath href="#p6"/>
    </animateMotion>
  </circle>

  <!-- network nodes, left cluster -->
  <g>
    <circle cx="60" cy="60" r="7" fill="url(#nodeGlow)"/>
    <circle cx="60" cy="60" r="4" fill="#36BCF7"/>
    <circle cx="60" cy="140" r="7" fill="url(#nodeGlow)"/>
    <circle cx="60" cy="140" r="4" fill="#36BCF7"/>
    <circle cx="60" cy="220" r="7" fill="url(#nodeGlow)"/>
    <circle cx="60" cy="220" r="4" fill="#36BCF7"/>
    <circle cx="340" cy="55" r="6" fill="#8A2BE2">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="220" r="6" fill="#8A2BE2">
      <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- network nodes, right cluster -->
  <g>
    <circle cx="840" cy="60" r="7" fill="url(#nodeGlow)"/>
    <circle cx="840" cy="60" r="4" fill="#36BCF7"/>
    <circle cx="840" cy="220" r="7" fill="url(#nodeGlow)"/>
    <circle cx="840" cy="220" r="4" fill="#36BCF7"/>
    <circle cx="560" cy="55" r="6" fill="#8A2BE2">
      <animate attributeName="r" values="6;9;6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="220" r="6" fill="#8A2BE2">
      <animate attributeName="r" values="6;9;6" dur="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- small robot face, center-top accent -->
  <g transform="translate(450,38)">
    <rect x="-26" y="-18" width="52" height="36" rx="10" fill="#1b1040" stroke="#36BCF7" stroke-width="2"/>
    <line x1="0" y1="-18" x2="0" y2="-30" stroke="#36BCF7" stroke-width="2"/>
    <circle cx="0" cy="-30" r="3.5" fill="#8A2BE2">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-11" cy="-2" r="4.5" fill="#36BCF7">
      <animate attributeName="opacity" values="1;1;0.05;1;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="11" cy="-2" r="4.5" fill="#36BCF7">
      <animate attributeName="opacity" values="1;1;0.05;1;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name -->
  <text x="450" y="150" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="46" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">
    KANHAIYA CHAUHAN
  </text>

  <!-- subtitle with typing cursor -->
  <text x="450" y="185" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a9b8f0" letter-spacing="1">
    <tspan>AI-Driven Full-Stack &amp; React Native Engineer</tspan>
  </text>
  <rect x="587" y="172" width="2" height="16" fill="#36BCF7">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom tagline -->
  <text x="450" y="215" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#5a6ba8" letter-spacing="2">
    BUILD • TRAIN • DEPLOY • REPEAT
  </text>
</svg>
